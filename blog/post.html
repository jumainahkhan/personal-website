<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes · Jumainah Khan</title>
<meta name="theme-color" content="#12081f">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .post-nav { padding-block: 28px; display: flex; justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
  .post-nav a { color: var(--muted); text-decoration: none; } .post-nav a:hover { color: var(--glow); }
  article { max-width: 680px; margin: 0 auto; padding-block: 32px 80px; }
  article header h1 { font: italic 600 clamp(2.4rem, 7vw, 4rem)/1.05 var(--serif); margin: 0 0 12px; color: var(--lav); text-wrap: balance; }
  article header time { color: var(--glow); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  .body { margin-top: 40px; font-size: 18px; }
  .body h2 { font-size: 2rem; margin: 48px 0 16px; } .body h3 { font: italic 600 1.5rem var(--serif); color: var(--lav); margin: 32px 0 10px; }
  .body img { border-radius: 12px; display: block; margin: 28px auto; }
  .body pre { background: var(--space-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; font-size: 14px; }
  .body code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; } .body :not(pre) > code { background: var(--space-2); padding: 1px 6px; border-radius: 6px; }
  .body blockquote { margin: 24px 0; padding-left: 20px; border-left: 2px solid var(--glow); color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="post-nav"><a href="../index.html">← Jumainah Khan</a><a href="../index.html#notes">All notes</a></nav>
  <article>
    <header><h1 id="title">Loading…</h1><time id="date"></time></header>
    <div class="body" id="body"></div>
  </article>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="posts.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("p");
  const post = (window.POSTS || []).find((p) => p.slug === slug);
  const title = document.getElementById("title"), body = document.getElementById("body");
  if (!post) {
    title.textContent = "Post not found";
    body.innerHTML = '<p>This note doesn\'t exist (yet). <a href="../index.html#notes">See all notes</a>.</p>';
  } else {
    document.title = post.title + " · Jumainah Khan";
    title.textContent = post.title;
    const d = document.getElementById("date");
    d.dateTime = post.date;
    d.textContent = new Date(post.date + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    fetch(`posts/${encodeURIComponent(slug)}.md`)
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then((md) => {
        // Images in posts are written relative to blog/, e.g. img/photo.jpg
        body.innerHTML = marked.parse(md);
      })
      .catch(() => { body.innerHTML = "<p>Couldn't load this post. Check that blog/posts/" + slug + ".md exists.</p>"; });
  }
</script>
</body>
</html>
